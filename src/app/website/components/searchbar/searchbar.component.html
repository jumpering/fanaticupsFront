<div class="search-bar">
  <input type="text" matInput [formControl]="searchControl" placeholder="Search..." class="input"
    [matAutocomplete]="auto">

  <mat-icon class="icon" matSuffix>search</mat-icon>
  <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onOptionSelected($event)" class="auto"
    [displayWith]="displayCupOrUser">
    <h4 class="title">Cups</h4>
    <mat-option *ngFor="let cup of cups | slice: 0:5" class="option"
      [value]="{name: cup.name, type: 'cup', id: cup.id}">
      {{cup.name}}
    </mat-option>
    <mat-divider></mat-divider>
    <h4 class="title">Users</h4>
    <mat-option *ngFor="let user of users | slice: 0:5" class="option"
      [value]="{name: user.name, type: 'user', id: user.id}">
      {{user.name}}
    </mat-option>
  </mat-autocomplete>
</div>
